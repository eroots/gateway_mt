name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }} (${{ matrix.deps }} dependencies)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
        include:
          - python: '3.10'
            deps: minimum     # oldest supported versions, pinned in tests/requirements-min.txt
          - python: '3.13'
            deps: latest
    env:
      QT_QPA_PLATFORM: offscreen   # GUI tests run without a display
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: System libraries for Qt and VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxrender1

      - name: Install (minimum dependency versions)
        if: matrix.deps == 'minimum'
        run: python -m pip install -c tests/requirements-min.txt -e ".[test]"

      - name: Install (latest dependency versions)
        if: matrix.deps == 'latest'
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest
